<html lang="ru">

<title>Лунный Свет — Аренда квартир</title>

<style>
  :root{
    --bg-deep:#05070f;
    --bg-mid:#0c1130;
    --ink:#eef1fb;
    --ink-soft:rgba(238,241,251,.66);
    --ink-faint:rgba(238,241,251,.4);
    --gold-1:#f6e6b4;
    --gold-2:#d9b46a;
    --silver-1:#eef2fb;
    --silver-2:#a9b7d8;
    --card-bg:rgba(255,255,255,.055);
    --card-bg-solid:#121734;
    --card-border:rgba(255,255,255,.14);
    --radius-lg:22px;
    --radius-md:16px;
    --font-display:'Marck Script', cursive;
    --font-body:'Manrope', system-ui, sans-serif;
    --accent-grad:linear-gradient(115deg, var(--gold-1) 0%, var(--silver-1) 35%, var(--gold-2) 65%, var(--gold-1) 100%);
  }

  *{box-sizing:border-box;}
  html,body{margin:0;padding:0; min-height:100%;}
  html{
    background:
      radial-gradient(ellipse 120% 40% at 50% 0%, #1c2660 0%, transparent 55%),
      linear-gradient(180deg, var(--bg-deep) 0%, var(--bg-mid) 45%, var(--bg-deep) 100%);
  }
  body{
    color:var(--ink);
    font-family:var(--font-body);
    min-height:100vh;
    -webkit-font-smoothing:antialiased;
    overflow-x:hidden;
  }

  /* ---------- Звёздное поле (фон) ---------- */
  .stars{
    position:fixed; inset:0; z-index:0; pointer-events:none;
    background-image:
      radial-gradient(1.6px 1.6px at 10% 15%, rgba(255,255,255,.9), transparent),
      radial-gradient(1.2px 1.2px at 25% 45%, rgba(255,255,255,.7), transparent),
      radial-gradient(1.8px 1.8px at 40% 8%, rgba(255,255,255,.8), transparent),
      radial-gradient(1.2px 1.2px at 60% 30%, rgba(255,255,255,.6), transparent),
      radial-gradient(1.6px 1.6px at 75% 60%, rgba(255,255,255,.85), transparent),
      radial-gradient(1.3px 1.3px at 85% 20%, rgba(255,255,255,.65), transparent),
      radial-gradient(1.6px 1.6px at 92% 75%, rgba(255,255,255,.8), transparent),
      radial-gradient(1.2px 1.2px at 15% 80%, rgba(255,255,255,.6), transparent),
      radial-gradient(1.4px 1.4px at 50% 90%, rgba(255,255,255,.7), transparent),
      radial-gradient(1.4px 1.4px at 33% 65%, rgba(255,255,255,.55), transparent);
    background-repeat:no-repeat;
    animation: twinkle 6s ease-in-out infinite alternate;
  }
  @keyframes twinkle{ from{opacity:.55} to{opacity:1} }
  @media (prefers-reduced-motion: reduce){ .stars{animation:none; opacity:.8;} }

  #app{position:relative; z-index:1; max-width:520px; margin:0 auto; min-height:100vh; padding-bottom:28px;}

  /* ---------- Topbar ---------- */
  .topbar{
    position:sticky; top:0; z-index:20;
    display:flex; align-items:center; gap:10px;
    padding:14px 18px; padding-top:max(14px, env(safe-area-inset-top));
    background:rgba(6,9,22,.6); backdrop-filter:blur(16px); -webkit-backdrop-filter:blur(16px);
    border-bottom:1px solid rgba(255,255,255,.08);
  }
  .topbar .back{
    width:34px; height:34px; border-radius:50%; border:1px solid var(--card-border);
    background:var(--card-bg); color:var(--ink); display:flex; align-items:center; justify-content:center;
    cursor:pointer; flex:0 0 auto; transition:transform .15s ease, background .2s ease;
  }
  .topbar .back:active{transform:scale(.9);}
  .topbar .back svg{width:16px;height:16px;}
  .topbar .brand{
    font-family:var(--font-display); font-size:22px; line-height:1;
    background:var(--accent-grad); -webkit-background-clip:text; background-clip:text; color:transparent;
    background-size:220% 100%;
  }
  .topbar .brand-sub{font-size:10.5px; color:var(--ink-faint); margin-top:2px; font-weight:600; letter-spacing:.03em;}
  .topbar .brand-wrap{display:flex; flex-direction:column;}

  /* ---------- Общие блоки ---------- */
  .section{padding:18px;}
  .hero-title{font-family:var(--font-display); font-size:40px; line-height:1; text-align:center;
    background:var(--accent-grad); -webkit-background-clip:text; background-clip:text; color:transparent; background-size:220% 100%;}
  .eyebrow{
    text-align:center; font-size:11px; letter-spacing:.14em; text-transform:uppercase;
    color:var(--gold-1); font-weight:700; opacity:.85; margin-bottom:6px;
  }
  .lede{text-align:center; color:var(--ink-soft); font-size:14px; line-height:1.5; margin:8px auto 0; max-width:340px;}

  .glass-card{
    background:var(--card-bg); border:1px solid var(--card-border); border-radius:var(--radius-lg);
    box-shadow:0 18px 40px rgba(0,0,0,.35), inset 0 1px 0 rgba(255,255,255,.06);
    backdrop-filter:blur(10px); -webkit-backdrop-filter:blur(10px);
  }

  /* ---------- Премиум-кнопка ---------- */
  .btn-premium{
    position:relative; overflow:hidden; display:flex; align-items:center; justify-content:center; gap:8px;
    width:100%; padding:16px 20px; border:none; border-radius:16px; cursor:pointer;
    font-family:var(--font-body); font-weight:800; font-size:15px; letter-spacing:.01em;
    color:#221708;
    background:var(--accent-grad); background-size:220% 100%;
    animation: shimmerMove 3.2s linear infinite;
    box-shadow:0 10px 26px rgba(217,180,106,.35), inset 0 1px 0 rgba(255,255,255,.6);
    transition:transform .15s ease, box-shadow .2s ease;
  }
  .btn-premium svg, .btn-ghost svg{width:18px; height:18px; flex:0 0 auto;}
  .btn-premium--compact{width:auto; display:inline-flex; margin:0 auto; padding:14px 28px;}
  .btn-premium:disabled{opacity:.45; cursor:not-allowed; filter:grayscale(.4); animation:none;}
  .btn-premium:not(:disabled):active{transform:scale(.97);}
  .btn-premium::after{
    content:""; position:absolute; top:0; left:-60%; width:40%; height:100%;
    background:linear-gradient(115deg, transparent, rgba(255,255,255,.75), transparent);
    transform:skewX(-20deg); animation: sweep 3.2s ease-in-out infinite;
  }
  @keyframes shimmerMove{0%{background-position:0% 50%}100%{background-position:220% 50%}}
  @keyframes sweep{0%{left:-60%}45%{left:120%}100%{left:120%}}
  @media (prefers-reduced-motion: reduce){ .btn-premium{animation:none;} .btn-premium::after{animation:none; display:none;} }

  .btn-ghost{
    width:100%; padding:14px 18px; border-radius:14px; border:1px solid var(--card-border);
    background:rgba(255,255,255,.04); color:var(--ink); font-family:var(--font-body); font-weight:700; font-size:14px;
    cursor:pointer;
  }

  /* ---------- Регистрация ---------- */
  .reg-hero{padding:18px 18px 6px; text-align:center;}
  .reg-hero .hero-banner{
    border-radius:20px; overflow:hidden; margin:0 auto 14px; max-width:420px;
    box-shadow:0 20px 50px rgba(0,0,0,.5), 0 0 60px rgba(216,190,130,.18);
    aspect-ratio:640/323; background-size:cover; background-position:center;
  }
  .reg-card{margin:16px; padding:16px; }
  .reg-card h3{margin:0 0 4px; font-size:15px;}
  .reg-card p{margin:0 0 12px; font-size:12.5px; color:var(--ink-soft); line-height:1.5;}
  .yform-wrap{
    border-radius:14px; overflow:hidden; background:#fff; min-height:420px;
    border:1px solid var(--card-border);
  }
  .yform-wrap iframe{width:100%; border:0; display:block; min-height:420px;}
  .notice-box{
    display:flex; gap:10px; align-items:flex-start; margin:14px 2px 4px;
    padding:12px 14px; border-radius:14px;
    background:linear-gradient(120deg, rgba(246,230,180,.14), rgba(246,230,180,.05));
    border:1px solid rgba(246,230,180,.4);
  }
  .notice-box .glyph{font-size:18px; line-height:1.3; flex:0 0 auto;}
  .notice-box p{margin:0; font-size:12.5px; line-height:1.5; color:var(--ink);}
  .notice-box b{color:var(--gold-1);}
  .confirm-row{display:flex; align-items:flex-start; gap:10px; margin:14px 2px 14px;}
  .confirm-row input{margin-top:3px; width:18px; height:18px; accent-color:#d9b46a;}
  .confirm-row label{font-size:12.5px; color:var(--ink-soft); line-height:1.45;}

  /* ---------- Кастомные премиум-поля (Имя / Телефон) ---------- */
  .field-group{margin-bottom:14px;}
  .field-group label{display:block; font-size:11.5px; font-weight:700; letter-spacing:.03em; text-transform:uppercase; color:var(--gold-1); margin-bottom:6px; opacity:.9;}
  .field-input-wrap{position:relative; display:flex; align-items:center;}
  .field-input-wrap .ic{position:absolute; left:14px; width:17px; height:17px; color:var(--ink-faint); pointer-events:none;}
  .field-input{
    width:100%; padding:14px 14px 14px 40px; border-radius:14px; font-size:15px; font-family:var(--font-body);
    background:rgba(255,255,255,.05); border:1px solid var(--card-border); color:var(--ink);
    transition:border-color .2s ease, background .2s ease;
  }
  .field-input::placeholder{color:var(--ink-faint);}
  .field-input:focus{outline:none; border-color:rgba(246,230,180,.55); background:rgba(255,255,255,.08);}
  .field-error{font-size:11.5px; color:#f0a3a3; margin-top:5px; min-height:14px;}

  .confirm-frame-note{display:flex; gap:8px; align-items:flex-start; margin:2px 2px 10px;}
  .confirm-frame-note .glyph{font-size:16px;}
  .confirm-frame-note p{margin:0; font-size:12px; color:var(--ink-soft); line-height:1.5;}
  .step-dots{display:flex; gap:6px; justify-content:center; margin:2px 0 16px;}
  .step-dots span{width:6px; height:6px; border-radius:50%; background:rgba(255,255,255,.18);}
  .step-dots span.active{background:var(--gold-1); width:16px; border-radius:4px;}

  /* ---------- Модальное окно регистрации ---------- */
  .modal-overlay{
    position:fixed; inset:0; z-index:50; display:flex; align-items:flex-end; justify-content:center;
    background:rgba(4,6,14,.7); backdrop-filter:blur(8px); -webkit-backdrop-filter:blur(8px);
    animation: fadeIn .25s ease;
  }
  @keyframes fadeIn{from{opacity:0} to{opacity:1}}
  .modal-sheet{
    width:100%; max-width:520px; max-height:90vh; overflow-y:auto;
    background:linear-gradient(180deg, #171c3d 0%, #0e1230 100%);
    border:1px solid rgba(246,230,180,.25);
    border-bottom:none;
    border-radius:26px 26px 0 0;
    box-shadow:0 -10px 50px rgba(0,0,0,.5), 0 0 60px rgba(216,190,130,.12);
    padding:10px 18px 26px;
    animation: slideUp .32s cubic-bezier(.2,.8,.3,1);
  }
  @keyframes slideUp{from{transform:translateY(100%)} to{transform:translateY(0)}}
  .modal-handle{width:40px; height:4px; border-radius:99px; background:rgba(255,255,255,.2); margin:8px auto 14px;}
  .modal-head{display:flex; align-items:center; justify-content:space-between; margin-bottom:2px;}
  .modal-head h3{margin:0; font-size:17px; font-family:var(--font-body); font-weight:800;}
  .modal-close{
    width:30px; height:30px; border-radius:50%; border:1px solid var(--card-border); background:rgba(255,255,255,.05);
    display:flex; align-items:center; justify-content:center; color:var(--ink-soft); cursor:pointer; flex:0 0 auto;
  }
  .modal-sheet .lede-small{font-size:12.5px; color:var(--ink-soft); margin:6px 0 10px;}
  .badge-row{display:flex; gap:8px; justify-content:center; flex-wrap:wrap; margin-top:14px;}
  .badge-pill{
    font-size:10.5px; font-weight:700; letter-spacing:.03em; color:var(--gold-1);
    border:1px solid rgba(246,230,180,.35); border-radius:999px; padding:5px 10px;
    background:rgba(246,230,180,.06);
  }

  /* ---------- Списки: города / районы ---------- */
  .grid-cards{display:flex; flex-direction:column; gap:14px; padding:6px 18px 18px;}
  .place-card{
    position:relative; border-radius:var(--radius-lg); overflow:hidden; cursor:pointer;
    border:1px solid var(--card-border); background:var(--card-bg-solid);
    transition:transform .18s ease, box-shadow .2s ease;
  }
  .place-card:active{transform:scale(.98);}
  .place-card .card-media{
    width:100%; aspect-ratio:400/175; background-size:cover; background-position:center;
    display:block;
  }
  .lot-hero-media{
    width:100%; aspect-ratio:400/150; background-size:cover; background-position:center 65%;
  }
  .place-card .overlay{
    position:absolute; left:0; right:0; bottom:0; padding:14px 16px;
    background:linear-gradient(0deg, rgba(4,6,16,.92) 5%, rgba(4,6,16,.35) 70%, transparent 100%);
    display:flex; align-items:flex-end; justify-content:space-between; gap:10px;
  }
  .place-card .name{font-weight:800; font-size:16px; color:var(--ink);}
  .place-card .meta{font-size:11.5px; color:var(--ink-faint); margin-top:2px;}
  .place-card .arrow{
    width:32px; height:32px; border-radius:50%; background:var(--accent-grad); flex:0 0 auto;
    display:flex; align-items:center; justify-content:center; color:#241a08;
  }
  .place-card .soon-tag{
    position:absolute; top:10px; right:10px; font-size:10px; font-weight:800; letter-spacing:.04em;
    color:#241a08; background:var(--accent-grad); padding:4px 9px; border-radius:999px;
  }
  .section-title{padding:20px 18px 4px; font-size:19px; font-weight:800;}
  .section-caption{padding:0 18px; color:var(--ink-soft); font-size:12.5px; margin-top:2px;}

  /* ---------- Пустое состояние ---------- */
  .empty-state{margin:10px 18px; padding:28px 20px; text-align:center; border-radius:var(--radius-lg);}
  .empty-state .glyph{font-size:30px; margin-bottom:8px;}
  .empty-state h4{margin:0 0 6px; font-size:15px;}
  .empty-state p{margin:0; font-size:12.5px; color:var(--ink-soft); line-height:1.5;}

  /* ---------- Карточки лотов ---------- */
  .lot-card{
    border-radius:var(--radius-md); padding:14px 16px; margin:0 18px 12px;
  }
  .lot-top{display:flex; align-items:center; justify-content:space-between; gap:8px; margin-bottom:6px;}
  .lot-num{font-weight:800; font-size:15px;}
  .lot-project{font-size:13px; color:var(--ink-soft); margin-bottom:12px;}
  .lot-btn{
    display:flex; align-items:center; justify-content:center; gap:6px;
    width:100%; padding:11px 14px; border-radius:12px; border:1px solid rgba(246,230,180,.4);
    background:rgba(246,230,180,.08); color:var(--gold-1); font-weight:700; font-size:13px;
    cursor:pointer; text-decoration:none;
  }
  .lot-btn:active{transform:scale(.98);}
  .lot-btn svg{width:14px; height:14px;}

  .footer-note{padding:22px 24px 8px; text-align:center; color:var(--ink-faint); font-size:11px; line-height:1.6;}
</style>
</head>

  try{
    if (!MAX || !MAX.initDataUnsafe) return null;
    const user = MAX.initDataUnsafe.user || null;
    const uid = user && user.id != null ? String(user.id) : '';
    return { chatId: uid, userId: uid };
  }catch(e){ return null; }
}

/* Каждому городу — свой оттенок лунного света поверх одного и того же фото */
const CITY_THEME = {
  krasnodar:   { filter: "none" },                                              // тёплое золото (оригинал)
  moscow:      { filter: "saturate(.55) brightness(1.08) contrast(1.05)" },     // серебро
  spb:         { filter: "hue-rotate(-45deg) saturate(1.2)" },                  // изумрудная ночь
  ekb:         { filter: "hue-rotate(50deg) saturate(1.15)" },                  // аметист
  rostov:      { filter: "hue-rotate(100deg) saturate(1.25) brightness(1.05)" },// розовое золото
  novosibirsk: { filter: "hue-rotate(-30deg) saturate(.9) brightness(1.1)" }    // ледяная лазурь
};

function cardMediaStyle(themeKey){
  const theme = CITY_THEME[themeKey] || CITY_THEME.krasnodar;
  return `background-image:url('${SKYLINE_IMG}'); filter:${theme.filter};`;
}

const ICON_BACK = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M15 6l-6 6 6 6"/></svg>`;
const ICON_LINK = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 5h5v5M19 5l-8 8M9 5H6a1 1 0 0 0-1 1v12a1 1 0 0 0 1 1h12a1 1 0 0 0 1-1v-3"/></svg>`;

/* ---------- Роутер ---------- */
const REGISTERED_KEY = 'ls_registered_v1';
function isRegistered(){
  try{ return localStorage.getItem(REGISTERED_KEY) === '1'; }catch(e){ return false; }
}
function setRegistered(){
  try{ localStorage.setItem(REGISTERED_KEY, '1'); }catch(e){}
}

let stack = [ isRegistered() ? {screen:'cities'} : {screen:'register'} ];

function push(state){ stack.push(state); render(); window.scrollTo(0,0); }
function goBack(){ if(stack.length>1){ stack.pop(); render(); window.scrollTo(0,0); } }

function topbar(title, showBack){
  return `
    <div class="topbar">
      ${showBack ? `<div class="back" id="btn-back">${ICON_BACK}</div>` : `<div style="width:34px"></div>`}
      <div class="brand-wrap">
        <div class="brand">${title || 'Лунный Свет'}</div>
        <div class="brand-sub">АРЕНДА КВАРТИР · БЕЗ ЗАЛОГА И КОМИССИИ</div>
      </div>
    </div>`;
}

function render(){
  const state = stack[stack.length-1];
  const app = document.getElementById('app');

  if (state.screen === 'register'){
    hideBackButton();
    app.innerHTML = renderRegister();
    bindRegister();
    return;
  }

  if (state.screen === 'cities'){
    setupBackButton(()=>{ /* корневой экран — уходить некуда внутри app */ });
    if (stack.length===1){ hideBackButton(); }
    app.innerHTML = topbar('Лунный Свет', false) + renderCities();
    bindPlaceCards('.city-card', (id)=>{
      const c = CITIES.find(x=>x.id===id);
      if (c && c.districts.length===1 && c.districts[0].lots) push({screen:'lots', cityId:id, districtId:c.districts[0].id});
      else push({screen:'districts', cityId:id});
    });
    return;
  }

  if (state.screen === 'districts'){
    setupBackButton(goBack);
    const city = CITIES.find(c=>c.id===state.cityId);
    const grp = (city && state.groupId) ? city.districts.find(d=>d.id===state.groupId) : null;
    app.innerHTML = topbar(grp ? grp.name : (city ? city.name : 'Район'), true) + renderDistricts(city, grp);
    document.getElementById('btn-back')?.addEventListener('click', goBack);
    bindPlaceCards('.district-card', (id)=>{
      const list = grp ? grp.children : city.districts;
      const item = list.find(d=>d.id===id);
      if (item && item.children) push({screen:'districts', cityId: state.cityId, groupId:id});
      else push({screen:'lots', cityId: state.cityId, groupId: state.groupId, districtId:id});
    });
    return;
  }

  if (state.screen === 'lots'){
    setupBackButton(goBack);
    const city = CITIES.find(c=>c.id===state.cityId);
    const lotList = city ? (state.groupId ? ((city.districts.find(d=>d.id===state.groupId)||{}).children||[]) : city.districts) : [];
    const district = lotList.find(d=>d.id===state.districtId);
    app.innerHTML = topbar(district ? district.name : 'Квартиры', true) + renderLots(city, district);
    document.getElementById('btn-back')?.addEventListener('click', goBack);
    bindLotButtons();
    return;
  }
}

/* ---------- Экран регистрации ---------- */
let regModalOpen = false;
let regStep = 'form'; // 'form' -> красивые поля, 'confirm' -> предзаполненная форма Яндекса
let regData = { name: '', phone: '' };

function renderRegister(){
  return `
    <div class="reg-hero">
      <div class="hero-banner" style="${cardMediaStyle('krasnodar')}"></div>
      <div class="eyebrow">Агентство недвижимости</div>
      <div class="hero-title">Лунный Свет</div>
      <p class="lede">Аренда квартир напрямую от собственников — без залога и без комиссии.</p>
      <div class="badge-row">
        <span class="badge-pill">БЕЗ ЗАЛОГА</span>
        <span class="badge-pill">БЕЗ КОМИССИИ</span>
      </div>
    </div>

    <div class="section" style="padding-top:6px; text-align:center;">
      <button class="btn-premium btn-premium--compact" id="btn-open-reg">
        Регистрация ${ICON_ARROW_RIGHT}
      </button>
      <div class="footer-note" style="padding-top:14px;">Доступ к каталогу открывается после регистрации</div>
    </div>

    ${regModalOpen ? renderRegisterModal() : ''}
  `;
}

const ICON_USER = `<svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 21a8 8 0 0 0-16 0"/><circle cx="12" cy="7" r="4"/></svg>`;
const ICON_PHONE = `<svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72c.127.96.362 1.903.7 2.81a2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45c.907.338 1.85.573 2.81.7A2 2 0 0 1 22 16.92z"/></svg>`;

function renderRegisterModal(){
  if (regStep === 'confirm'){
    const prefillUrl = buildYandexPrefillUrl(regData.name, regData.phone);
    return `
      <div class="modal-overlay" id="reg-overlay">
        <div class="modal-sheet" id="reg-sheet">
          <div class="modal-handle"></div>
          <div class="modal-head">
            <h3>Последний шаг</h3>
            <div class="modal-close" id="modal-close">✕</div>
          </div>
          <div class="step-dots"><span></span><span class="active"></span></div>

          <div class="confirm-frame-note">
            <span class="glyph">☾</span>
            <p>Мы подставили ваше имя и телефон в форму ниже — просто нажмите в ней «Отправить», чтобы завершить регистрацию.</p>
          </div>

          <div class="yform-wrap">
            <iframe src="${prefillUrl}" frameborder="0" name="ya-form-6a795a641f1eb58aa72b544a" width="100%" height="420"></iframe>
          </div>

          <div class="confirm-row">
            <input type="checkbox" id="confirm-sent">
            <label for="confirm-sent">Я нажал(а) «Отправить» в форме выше</label>
          </div>

          <button class="btn-premium" id="btn-enter" disabled>
            Войти в каталог ${ICON_ARROW_RIGHT}
          </button>
        </div>
      </div>
    `;
  }

  return `
    <div class="modal-overlay" id="reg-overlay">
      <div class="modal-sheet" id="reg-sheet">
        <div class="modal-handle"></div>
        <div class="modal-head">
          <h3>Регистрация</h3>
          <div class="modal-close" id="modal-close">✕</div>
        </div>
        <div class="step-dots"><span class="active"></span><span></span></div>
        <p class="lede-small">Укажите имя и телефон, чтобы открыть каталог квартир.</p>

        <div class="notice-box">
          <span class="glyph">☾</span>
          <p><b>Важно:</b> указывайте номер телефона, по которому вы лично будете связываться с собственниками квартир. Если номер окажется недействующим, льготные условия — без залога и без комиссии — не будут действовать.</p>
        </div>

        <div class="field-group">
          <label for="f-name">Ваше имя</label>
          <div class="field-input-wrap">
            ${ICON_USER}
            <input class="field-input" id="f-name" type="text" placeholder="Например, Анна" value="${escapeAttr(regData.name)}" autocomplete="name">
          </div>
          <div class="field-error" id="err-name"></div>
        </div>

        <div class="field-group">
          <label for="f-phone">Номер телефона</label>
          <div class="field-input-wrap">
            ${ICON_PHONE}
            <input class="field-input" id="f-phone" type="tel" placeholder="+7 900 000-00-00" value="${escapeAttr(regData.phone)}" autocomplete="tel">
          </div>
          <div class="field-error" id="err-phone"></div>
        </div>

        <button class="btn-premium" id="btn-continue">
          Продолжить ${ICON_ARROW_RIGHT}
        </button>
      </div>
    </div>
  `;
}

function buildYandexPrefillUrl(name, phone){
  const base = YANDEX_FORM_URL.split('?')[0];
  const params = new URLSearchParams();
  params.set('iframe', '1');
  if (YANDEX_FIELD_IDS.name)  params.set(YANDEX_FIELD_IDS.name, name);
  if (YANDEX_FIELD_IDS.phone) params.set(YANDEX_FIELD_IDS.phone, phone);
  if (YANDEX_FIELD_IDS.tgUserId && MAX_CONTEXT && MAX_CONTEXT.chatId){
    params.set(YANDEX_FIELD_IDS.tgUserId, MAX_CONTEXT.chatId);
  }
  return base + '?' + params.toString();
}

function bindRegister(){
  document.getElementById('btn-open-reg')?.addEventListener('click', ()=>{
    haptic('light');
    regStep = 'form';
    regModalOpen = true;
    render();
  });

  const overlay = document.getElementById('reg-overlay');
  if (!overlay) return;

  document.getElementById('modal-close')?.addEventListener('click', ()=>{
    haptic('light');
    regModalOpen = false;
    render();
  });
  overlay.addEventListener('click', (e)=>{
    if (e.target === overlay){ regModalOpen = false; render(); }
  });

  if (regStep === 'form'){
    const btnContinue = document.getElementById('btn-continue');
    btnContinue.addEventListener('click', ()=>{
      const nameEl = document.getElementById('f-name');
      const phoneEl = document.getElementById('f-phone');
      const errName = document.getElementById('err-name');
      const errPhone = document.getElementById('err-phone');
      const name = nameEl.value.trim();
      const phone = phoneEl.value.trim();
      let ok = true;

      if (name.length < 2){ errName.textContent = 'Укажите, как вас зовут'; ok = false; } else { errName.textContent=''; }
      const phoneDigits = phone.replace(/\D/g,'');
      if (phoneDigits.length < 10){ errPhone.textContent = 'Проверьте номер телефона'; ok = false; } else { errPhone.textContent=''; }

      if (!ok){ haptic('medium'); return; }

      regData.name = name;
      regData.phone = phone;
      haptic('medium');
      regStep = 'confirm';
      render();
    });
    return;
  }

  const checkbox = document.getElementById('confirm-sent');
  const btn = document.getElementById('btn-enter');
  checkbox.addEventListener('change', ()=>{ btn.disabled = !checkbox.checked; });
  btn.addEventListener('click', ()=>{
    if (btn.disabled) return;
    haptic('medium');
    setRegistered();
    stack = [{screen:'cities'}];
    render();
  });
}

/* ---------- Экран городов ---------- */
function renderCities(){
  const cards = CITIES.map(city => placeCardHTML({
    seedKey: 'city-'+city.id,
    themeKey: city.id,
    name: city.name,
    meta: (city.districts.length===1 && city.districts[0].lots) ? `${city.districts[0].lots.length} вариантов аренды` : city.districts.length ? `${city.districts.length} подборки в каталоге` : 'Скоро появится в каталоге',
    soon: city.districts.length === 0,
    cls: 'city-card',
    dataId: city.id
  })).join('');

  return `
    <div class="section-title">Выберите город</div>
    <div class="section-caption">Мы подберём варианты аренды в нужном вам районе</div>
    <div class="grid-cards">${cards}</div>
  `;
}

/* ---------- Экран районов ---------- */
function renderDistricts(city, grp){
  if (!city){
    return emptyStateHTML('Город не найден', 'Похоже, что-то пошло не так. Вернитесь назад и выберите город заново.');
  }
  if (!city.districts.length){
    return `
      <div class="section-title">${city.name}</div>
      ${emptyStateHTML('Скоро появится', `Мы уже подбираем варианты аренды в городе «${city.name}». Загляните немного позже — список районов появится здесь.`)}
    `;
  }
  const items = grp ? grp.children : city.districts;
  const cnt = d => d.children ? d.children.reduce((n,c)=>n+c.lots.length,0) : d.lots.length;
  const cards = items.map(d => placeCardHTML({
    seedKey: 'district-'+city.id+'-'+d.id,
    themeKey: city.id,
    name: d.name,
    meta: d.children ? `${d.children.length} район(а/ов) · ${cnt(d)} лотов` : (d.lots.length ? `${d.lots.length} доступных лотов` : 'Скоро появится'),
    soon: cnt(d) === 0,
    cls: 'district-card',
    dataId: d.id
  })).join('');

  return `
    <div class="section-title">${grp ? grp.name : city.name}</div>
    <div class="section-caption">${grp ? 'Выберите район или жилой комплекс' : 'Выберите подборку квартир'}</div>
    <div class="grid-cards">${cards}</div>
  `;
}

/* ---------- Экран квартир ---------- */
function renderLots(city, district){
  if (!city || !district){
    return emptyStateHTML('Раздел не найден', 'Вернитесь назад и выберите район заново.');
  }
  const heroStyle = cardMediaStyle(city.id);
  if (!district.lots.length){
    return `
      <div class="glass-card" style="margin:16px; overflow:hidden;"><div class="lot-hero-media" style="${heroStyle}"></div></div>
      ${emptyStateHTML('Пока нет доступных квартир', `В районе «${district.name}» сейчас нет активных лотов. Мы скоро добавим новые варианты.`)}
    `;
  }
  const cards = district.lots.map(lot => `
    <div class="glass-card lot-card">
      <div class="lot-top"><span class="lot-num">${escapeHTML(lot.lot)}</span></div>
      <div class="lot-project">${escapeHTML(lot.project)}</div>
      <a class="lot-btn" href="${escapeAttr(lot.url)}" data-url="${escapeAttr(lot.url)}" target="_blank" rel="noopener">
        Открыть объявление ${ICON_LINK}
      </a>
    </div>
  `).join('');

  return `
    <div class="glass-card" style="margin:16px 16px 8px; overflow:hidden;"><div class="lot-hero-media" style="${heroStyle}"></div></div>
    <div class="section-caption" style="padding:0 18px 8px;">${district.lots.length} вариантов аренды · нажмите, чтобы открыть объявление в браузере</div>
    ${cards}
    <div class="footer-note">Лунный Свет · Подбор объектов недвижимости</div>
  `;
}

/* ---------- Вспомогательные шаблоны ---------- */
function placeCardHTML({seedKey, themeKey, name, meta, soon, cls, dataId}){
  return `
    <div class="place-card ${cls}" data-id="${escapeAttr(dataId)}">
      <div class="card-media" style="${cardMediaStyle(themeKey)}"></div>
      ${soon ? `<div class="soon-tag">СКОРО</div>` : ''}
      <div class="overlay">
        <div>
          <div class="name">${escapeHTML(name)}</div>
          <div class="meta">${escapeHTML(meta)}</div>
        </div>
        <div class="arrow">${ICON_ARROW_RIGHT}</div>
      </div>
    </div>
  `;
}
function emptyStateHTML(title, text){
  return `
    <div class="glass-card empty-state">
      <div class="glyph">🌙</div>
      <h4>${escapeHTML(title)}</h4>
      <p>${escapeHTML(text)}</p>
    </div>
  `;
}
function bindPlaceCards(selector, onClick){
  document.querySelectorAll(selector).forEach(el=>{
    el.addEventListener('click', ()=>{ haptic('light'); onClick(el.getAttribute('data-id')); });
  });
}
function bindLotButtons(){
  document.querySelectorAll('.lot-btn').forEach(el=>{
    el.addEventListener('click', (e)=>{
      haptic('light');
      if (INSIDE_MAX && typeof MAX.openLink === 'function'){
        // Внутри Telegram — открываем через мост во внешнем браузере.
        e.preventDefault();
        try{ MAX.openLink(el.getAttribute('data-url')); }
        catch(err){ window.open(el.getAttribute('data-url'), '_blank', 'noopener'); }
      }
      // Вне Telegram preventDefault не вызываем — сработает обычный переход
      // по ссылке target="_blank" (сам браузер откроет новую вкладку).
    });
  });
}
function escapeHTML(str){
  return String(str).replace(/[&<>"']/g, s => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[s]));
}
function escapeAttr(str){ return escapeHTML(str); }

render();
</script>
</body>
</html>
